<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
    <style>
        .hidden-scrollbar::-webkit-scrollbar { display: none; }
        .hidden-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">

    <div id="app-container" class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl relative">
        <div id="dot-login" onclick="openPinModal()" class="absolute bottom-2 left-6 w-1.5 h-1.5 bg-slate-700 rounded-full cursor-pointer opacity-40 hover:opacity-100 transition-opacity"></div>
        <div id="content-area" class="space-y-6">
            <div class="flex flex-col items-center text-center space-y-3">
                <div class="relative w-24 h-24 rounded-full overflow-hidden border-2 border-slate-700 bg-slate-800 shadow-inner">
                    <img id="main-logo" src="https://via.placeholder.com/150" alt="Logo" class="w-full h-full object-cover">
                </div>
                <h1 id="site-title" class="text-2xl font-bold tracking-tight text-white">Loading...</h1>
            </div>
            <div id="links-container" class="space-y-3"></div>
            <div class="pt-4 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400 px-1">
                <span id="footer-text">Provided by Smart Cards</span>
                <a id="connect-link" href="#" class="text-blue-400 hover:underline font-medium">Connect</a>
            </div>
        </div>
        <div id="expired-screen" class="hidden text-center py-12 space-y-4">
            <h2 class="text-2xl font-bold text-red-400">Session Expired</h2>
            <p class="text-sm text-slate-300">Thank you for coming! Visit again. Please scan the QR code again at the counter when you visit our shop.</p>
        </div>
    </div>

    <!-- PIN Modal -->
    <div id="pin-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-700 p-6 rounded-2xl w-full max-w-xs space-y-4 shadow-2xl text-center">
            <h3 class="text-lg font-semibold text-white">Enter 6-Digit PIN</h3>
            <input type="password" id="pin-input" maxlength="6" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-center text-xl tracking-widest focus:outline-none focus:border-blue-500 text-white" placeholder="••••••">
            <div class="flex space-x-2">
                <button onclick="verifyPin()" class="flex-1 bg-blue-600 hover:bg-blue-500 py-2 rounded-xl font-medium text-white transition-colors">Login</button>
                <button onclick="closePinModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 py-2 rounded-xl font-medium text-slate-300 transition-colors">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Admin Panel Modal -->
    <div id="admin-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md hidden overflow-y-auto p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 max-w-md mx-auto space-y-6 shadow-2xl relative">
            <div class="flex items-center justify-between border-b border-slate-800 pb-4">
                <h2 class="text-xl font-bold text-white">Admin Control Panel</h2>
                <button onclick="closeAdminPanel()" class="text-slate-400 hover:text-white font-bold text-xl px-2">✕</button>
            </div>
            <div class="space-y-4 max-h-[70vh] overflow-y-auto pr-1 hidden-scrollbar">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Main Logo</label>
                    <input type="file" id="admin-main-logo" accept="image/*" onchange="uploadImage('main')" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Website Title</label>
                    <input type="text" id="admin-title" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Footer Text</label>
                    <input type="text" id="admin-footer" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Connect Link URL</label>
                    <input type="text" id="admin-connect-url" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div class="border-t border-slate-800 pt-4">
                    <h3 class="text-sm font-semibold text-slate-300 mb-3">Manage Links</h3>
                    <div id="admin-links-list" class="space-y-3"></div>
                    <button onclick="addNewButtonField()" class="w-full border border-dashed border-slate-700 hover:border-slate-500 py-2 rounded-xl text-xs font-medium text-slate-400 hover:text-white transition-colors mt-2">+ Add New Button</button>
                </div>
                <div class="border-t border-slate-800 pt-4 space-y-3">
                    <h3 class="text-sm font-semibold text-slate-200">Security & Settings</h3>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Change Admin PIN</label>
                        <input type="password" id="admin-new-pin" maxlength="6" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-blue-500" placeholder="New 6-digit PIN">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Session Expiry Time</label>
                        <select id="admin-expiry" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-blue-500">
                            <option value="0">Never</option>
                            <option value="5">5 Minutes</option>
                            <option value="15">15 Minutes</option>
                            <option value="20">20 Minutes</option>
                            <option value="30">30 Minutes</option>
                            <option value="60">1 Hour</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="border-t border-slate-800 pt-4">
                <button onclick="saveAllChanges()" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-bold text-white shadow-lg transition-all">Save & Sync All Changes</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDLk_V1n8MNKIAOOICKiSp-WwO_FSMHBS8",
            databaseURL: "https://smart-nfc-a38ca-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const dbRef = database.ref('cardData');

        let cardData = {
            title: "My Digital Card",
            mainLogo: "https://via.placeholder.com/150",
            footerText: "Provided by Smart Cards",
            connectUrl: "#",
            pin: "123456",
            expiryMinutes: 0,
            startTime: Date.now(),
            buttons: [
                { id: 'btn-1', text: 'WhatsApp', url: 'https://wa.me/', icon: 'https://via.placeholder.com/100' },
                { id: 'btn-2', text: 'Instagram', url: 'https://instagram.com/', icon: 'https://via.placeholder.com/100' }
            ]
        };

        const channel = new BroadcastChannel('card_sync_channel');
        channel.onmessage = (event) => { if (event.data === 'updated') loadDataFromFirebase(); };

        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0) || e.keyCode == 'C'.charCodeAt(0))) || (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0))) return false;
        };

        window.onload = () => {
            const storedStart = localStorage.getItem('visit_start_time');
            if(!storedStart) {
                const now = Date.now();
                localStorage.setItem('visit_start_time', now);
                cardData.startTime = now;
            } else {
                cardData.startTime = parseInt(storedStart);
            }
            loadDataFromFirebase();
        };

        function checkSessionExpiry() {
            if(cardData.expiryMinutes > 0 && cardData.startTime) {
                const elapsedMinutes = (Date.now() - cardData.startTime) / (1000 * 60);
                if(elapsedMinutes >= cardData.expiryMinutes) {
                    document.getElementById('content-area').classList.add('hidden');
                    document.getElementById('expired-screen').classList.remove('hidden');
                }
            }
        }

        function loadDataFromFirebase() {
            dbRef.once('value').then((snapshot) => {
                const firebaseData = snapshot.val();
                if(firebaseData) {
                    cardData = firebaseData;
                    if(!cardData.startTime) {
                        cardData.startTime = parseInt(localStorage.getItem('visit_start_time')) || Date.now();
                    }
                }
                renderUserView();
                checkSessionExpiry();
                setInterval(checkSessionExpiry, 30000);
            });
        }

        function renderUserView() {
            document.getElementById('main-logo').src = cardData.mainLogo || "https://via.placeholder.com/150";
            document.getElementById('site-title').innerText = cardData.title || "My Digital Card";
            document.getElementById('footer-text').innerText = cardData.footerText || "Provided by Smart Cards";
            document.getElementById('connect-link').href = cardData.connectUrl || "#";

            const container = document.getElementById('links-container');
            container.innerHTML = '';
            (cardData.buttons || []).forEach(btn => {
                const a = document.createElement('a');
                a.href = btn.url;
                a.target = "_blank";
                a.className = "flex items-center space-x-4 p-3 bg-slate-800 hover:bg-slate-700 border border-slate-700/50 rounded-2xl transition-all shadow-md group";
                a.innerHTML = `
                    <div class="w-12 h-12 rounded-xl overflow-hidden bg-slate-900 border border-slate-600 flex-shrink-0">
                        <img src="${btn.icon || 'https://via.placeholder.com/100'}" class="w-full h-full object-cover">
                    </div>
                    <span class="font-medium text-white group-hover:text-blue-400 transition-colors">${btn.text}</span>
                `;
                container.appendChild(a);
            });
        }

        function openPinModal() { document.getElementById('pin-modal').classList.replace('hidden', 'flex'); }
        function closePinModal() { 
            document.getElementById('pin-modal').classList.replace('flex', 'hidden'); 
            document.getElementById('pin-input').value = '';
        }
        function verifyPin() {
            const entered = document.getElementById('pin-input').value;
            if(entered === cardData.pin) {
                closePinModal();
                openAdminPanel();
            } else {
                alert("Incorrect PIN!");
            }
        }

        function openAdminPanel() {
            document.getElementById('admin-main-logo').value = '';
            document.getElementById('admin-title').value = cardData.title;
            document.getElementById('admin-footer').value = cardData.footerText;
            document.getElementById('admin-connect-url').value = cardData.connectUrl;
            document.getElementById('admin-new-pin').value = '';
            document.getElementById('admin-expiry').value = cardData.expiryMinutes || 0;

            const list = document.getElementById('admin-links-list');
            list.innerHTML = '';
            (cardData.buttons || []).forEach((btn, index) => {
                appendButtonFields(btn.text, btn.url, btn.icon, index);
            });
            document.getElementById('admin-modal').classList.replace('hidden', 'flex');
        }
        function closeAdminPanel() { document.getElementById('admin-modal').classList.replace('flex', 'hidden'); }

        function appendButtonFields(text='', url='', icon='', index=null) {
            const list = document.getElementById('admin-links-list');
            const div = document.createElement('div');
            const idx = index !== null ? index : list.children.length;
            div.className = "p-4 bg-slate-800 border border-slate-700 rounded-2xl space-y-3 relative";
            div.innerHTML = `
                <button onclick="this.parentElement.remove()" class="absolute top-3 right-3 text-slate-500 hover:text-red-400 font-bold text-sm px-2">Delete</button>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1">Button Text</label>
                        <input type="text" class="btn-text w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white" value="${text}">
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1">Upload Icon</label>
                        <input type="file" accept="image/*" onchange="uploadButtonIcon(this)" class="w-full text-[10px] text-slate-400 file:mr-1 file:py-1 file:px-2 file:rounded-lg file:border-0 file:text-[9px] file:bg-slate-700 file:text-white cursor-pointer">
                        <input type="hidden" class="btn-icon" value="${icon}">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] text-slate-400 mb-1">Destination URL</label>
                    <input type="text" class="btn-url w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white" value="${url}">
                </div>
            `;
            list.appendChild(div);
        }
        function addNewButtonField() { appendButtonFields(); }

        function uploadImage(type) {
            const fileInput = type === 'main' ? document.getElementById('admin-main-logo') : event.target;
            const file = fileInput.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    if(type === 'main') {
                        document.getElementById('main-logo').src = e.target.result;
                    } else {
                        fileInput.nextElementSibling.value = e.target.result;
                    }
                };
                reader.readAsDataURL(file);
            }
        }
        function uploadButtonIcon(input) {
            const file = input.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = (e) => { input.nextElementSibling.value = e.target.result; };
                reader.readAsDataURL(file);
            }
        }

        function saveAllChanges() {
            const newTitle = document.getElementById('admin-title').value;
            const newFooter = document.getElementById('admin-footer').value;
            const newConnectUrl = document.getElementById('admin-connect-url').value;
            const newPin = document.getElementById('admin-new-pin').value;
            const newExpiry = parseInt(document.getElementById('admin-expiry').value);

            const newButtons = [];
            document.querySelectorAll('#admin-links-list > div').forEach(div => {
                newButtons.push({
                    text: div.querySelector('.btn-text').value,
                    url: div.querySelector('.btn-url').value,
                    icon: div.querySelector('.btn-icon').value
                });
            });

            cardData.title = newTitle;
            cardData.footerText = newFooter;
            cardData.connectUrl = newConnectUrl;
            if(newPin.length === 6) cardData.pin = newPin;
            cardData.expiryMinutes = newExpiry;
            cardData.buttons = newButtons;

            dbRef.set(cardData).then(() => {
                channel.postMessage('updated');
                closeAdminPanel();
                renderUserView();
                alert("All changes saved and synced successfully!");
            }).catch(err => {
                alert("Failed to save: " + err.message);
            });
        }
    </script>
</body>
</html>
